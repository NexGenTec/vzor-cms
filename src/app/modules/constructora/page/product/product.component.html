<div class="mb-4 flex justify-between">
  <div class="inline-block">
    <h3 class="font-semibold text-foreground">Productos</h3>
    <div class="space-x-1 text-xs font-medium text-muted-foreground">
      <a href="" class="hover:text-primary">Todos los productos: </a>
      <span class="text-foreground">{{ filteredProducts().length }}</span>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2 sm:space-x-4">
    <button  (click)="openExportConfirmation('pdf')"
      class="flex items-center justify-center rounded-md bg-muted px-4 py-2.5 text-xs font-semibold text-muted-foreground hover:text-foreground">
      Exportar a 
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="#d32f2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-file-type-pdf">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M14 3v4a1 1 0 0 0 1 1h4" />
        <path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
        <path d="M5 18h1.5a1.5 1.5 0 0 0 0 -3h-1.5v6" />
        <path d="M17 18h2" />
        <path d="M20 15h-3v6" />
        <path d="M11 15v6h1a2 2 0 0 0 2 -2v-2a2 2 0 0 0 -2 -2h-1z" />
      </svg>
    </button>
  
  
    <button (click)="openExportConfirmation('csv')"
      class="flex items-center justify-center rounded-md bg-muted px-4 py-2.5 text-xs font-semibold text-muted-foreground hover:text-foreground">
      Exportar a 
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-file-type-csv">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M14 3v4a1 1 0 0 0 1 1h4" />
        <path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
        <path d="M7 16.5a1.5 1.5 0 0 0 -3 0v3a1.5 1.5 0 0 0 3 0" />
        <path d="M10 20.25c0 .414 .336 .75 .75 .75h1.25a1 1 0 0 0 1 -1v-1a1 1 0 0 0 -1 -1h-1a1 1 0 0 1 -1 -1v-1a1 1 0 0 1 1 -1h1.25a.75 .75 0 0 1 .75 .75" />
        <path d="M16 15l2 6l2 -6" />
      </svg>
    </button>

    <div *ngIf="isLoading" class="flex justify-center items-center fixed top-0 left-0 right-0 bottom-0 bg-black bg-opacity-50 z-50">
      <div class="flex items-center space-x-2">
        <svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <circle cx="12" cy="12" r="10" stroke-width="4" stroke="currentColor" fill="none"></circle>
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 2L14 6L18 6"></path>
        </svg>
        <span class="text-white text-xl">Importando productos...</span>
      </div>
    </div>


   <!-- Botón para seleccionar archivo -->
    <button (click)="triggerFileInput()"
    class="flex items-center justify-center rounded-md bg-muted px-4 py-2.5 text-xs font-semibold text-muted-foreground hover:text-foreground">
    Importar 
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
      stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="ml-2">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M14 3v4a1 1 0 0 0 1 1h4" />
      <path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
      <path d="M7 16.5a1.5 1.5 0 0 0 -3 0v3a1.5 1.5 0 0 0 3 0" />
      <path d="M10 20.25c0 .414 .336 .75 .75 .75h1.25a1 1 0 0 0 1 -1v-1a1 1 0 0 0 -1 -1h-1a1 1 0 0 1 -1 -1v-1a1 1 0 0 1 1 -1h1.25a.75 .75 0 0 1 .75 .75" />
      <path d="M16 15l2 6l2 -6" />
    </svg>
    </button>

    <!-- Input oculto -->
    <input type="file" #fileInput (change)="onFileSelected($event)" accept=".csv" class="hidden" />

    <!-- Modal de Confirmación -->
    <div *ngIf="isModalOpenCSV" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
      <h2 class="text-lg font-semibold">Confirmar Importación</h2>
      <p class="text-sm text-gray-600 mt-2">¿Estás seguro de que deseas importar este archivo CSV?</p>
      <div class="mt-4 flex justify-end space-x-2">
        <button (click)="closeModalCsv()" class="px-4 py-2 text-sm bg-gray-300 rounded-md hover:bg-gray-400">Cancelar</button>
        <button (click)="importCSV()"  class="flex-none rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground hover:bg-primary-dark transition">Importar</button>
      </div>
    </div>
    </div>

    <button (click)="openModal()"
      class="flex items-center justify-center rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground w-full sm:w-auto">
      Agregar Producto
    </button>

    <button 
    *ngIf="selectedProducts().length > 1"
      (click)="deleteSelected()"
      [disabled]="!isDeleteButtonEnabled()"
      [ngClass]="{'opacity-50 cursor-not-allowed': !isDeleteButtonEnabled()}"
      class="flex items-center justify-center gap-2 rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground w-full sm:w-auto transition-all duration-300 hover:bg-red-600 active:scale-95">
      <p>Productos seleccionados: {{ selectedProducts().length }}</p>
      <svg-icon src="assets/icons/heroicons/outline/delete.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
    </button>

    <app-modal 
      [isOpen]="isModalOpenExport"
      (confirm)="handleExportConfirmation(isExporting!)"
      (cancel)="isModalOpenExport = false">
    </app-modal>
   
  </div>  
</div>
<app-add-product-modal *ngIf="isModalOpen" [product]="selectedProduct"   (closeModalEvent)="closeModal()"></app-add-product-modal>

<div class="flex min-w-full flex-col rounded-xl border border-muted/20 bg-background p-2">
  <app-product-action></app-product-action>
  <div class="scrollbar-thumb-rounded scrollbar-track-rounded grow overflow-x-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted">
    <table class="table w-full table-auto border-collapse border-0 text-left align-middle leading-5 text-muted-foreground">
      <thead class="border border-muted/20 text-xs text-muted-foreground">
        <tr app-product-header (onCheck)="toggleProducts($event)"></tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of pagedProducts()" app-product-row [product]="product" [onEditProduct]="openEditModal.bind(this)" (click)="toggleProductSelection(product)"></tr>
        <tr *ngIf="filteredProducts().length === 0">
          <td class="py-4 text-center text-sm" colspan="7">No se encontraron productos</td>
        </tr>
      </tbody>
    </table>
  </div>
  <app-product-footer 
    [currentPage]="currentPage"
    [totalProducts]="totalProducts"
    [pageSize]="pageSize"
    (pageChanged)="changePage($event)"
    (pageSizeChanged)="changePageSize($event)">
  </app-product-footer>
</div>
