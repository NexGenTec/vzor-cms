<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
    <!-- Modal Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">
        {{ project ? 'Editar Proyecto' : 'Nuevo Proyecto' }}
      </h2>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      <!-- Basic Information Section -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Project Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
            Nombre del Proyecto *
          </label>
          <input
            id="name"
            type="text"
            formControlName="name"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Ingrese el nombre del proyecto"
            [class.border-red-500]="projectForm.get('name')?.invalid && projectForm.get('name')?.touched" />
          <div *ngIf="projectForm.get('name')?.invalid && projectForm.get('name')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="projectForm.get('name')?.errors?.['required']">El nombre es requerido</span>
            <span *ngIf="projectForm.get('name')?.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</span>
          </div>
        </div>

        <!-- Project Category -->
        <div>
          <label for="category" class="block text-sm font-medium text-gray-700 mb-2">
            Categoría *
          </label>
          <select
            id="category"
            formControlName="category"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="projectForm.get('category')?.invalid && projectForm.get('category')?.touched">
            <option value="">Seleccione una categoría</option>
            <option value="Desarrollo">Desarrollo</option>
            <option value="Diseño">Diseño</option>
            <option value="Marketing">Marketing</option>
            <option value="Ventas">Ventas</option>
            <option value="Soporte">Soporte</option>
            <option value="Investigación">Investigación</option>
            <option value="Infraestructura">Infraestructura</option>
            <option value="Otros">Otros</option>
          </select>
          <div *ngIf="projectForm.get('category')?.invalid && projectForm.get('category')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="projectForm.get('category')?.errors?.['required']">La categoría es requerida</span>
          </div>
        </div>

        <!-- Project Status -->
        <div>
          <label for="status" class="block text-sm font-medium text-gray-700 mb-2">
            Estado *
          </label>
          <select
            id="status"
            formControlName="status"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="projectForm.get('status')?.invalid && projectForm.get('status')?.touched">
            <option value="">Seleccione un estado</option>
            <option value="Activo">Activo</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Completado">Completado</option>
            <option value="Cancelado">Cancelado</option>
            <option value="En Pausa">En Pausa</option>
            <option value="En Revisión">En Revisión</option>
          </select>
          <div *ngIf="projectForm.get('status')?.invalid && projectForm.get('status')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="projectForm.get('status')?.errors?.['required']">El estado es requerido</span>
          </div>
        </div>

        <!-- Project Budget -->
        <div>
          <label for="budget" class="block text-sm font-medium text-gray-700 mb-2">
            Presupuesto
          </label>
          <input
            id="budget"
            type="number"
            formControlName="budget"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="0.00" />
        </div>
      </div>

      <!-- Project Description -->
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
          Descripción
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Descripción del proyecto"></textarea>
      </div>

      <!-- Teams Section -->
      <div class="border-t border-gray-200 pt-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-medium text-gray-900">Equipos</h3>
          <button
            type="button"
            (click)="addTeam()"
            class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-blue-600 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            Agregar Equipo
          </button>
        </div>

        <div formArrayName="equipos" class="space-y-4">
          <div *ngFor="let team of equiposArray.controls; let i = index" [formGroupName]="i" class="bg-gray-50 p-4 rounded-lg">
            <div class="flex items-center justify-between mb-3">
              <h4 class="text-sm font-medium text-gray-700">Equipo {{ i + 1 }}</h4>
              <button
                type="button"
                (click)="removeTeam(i)"
                class="text-red-600 hover:text-red-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Equipo</label>
                <input
                  type="text"
                  formControlName="name"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Nombre del equipo" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
                <input
                  type="text"
                  formControlName="role"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Rol del equipo" />
              </div>
            </div>

            <!-- Assigned Users -->
            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-2">Usuarios Asignados</label>
              <div formArrayName="assignedUsers" class="space-y-2">
                <div *ngFor="let user of getTeamUsers(i).controls; let j = index" [formGroupName]="j" class="flex items-center gap-2">
                  <input
                    type="text"
                    formControlName="name"
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Nombre del usuario" />
                  <input
                    type="email"
                    formControlName="email"
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Email del usuario" />
                  <button
                    type="button"
                    (click)="removeTeamUser(i, j)"
                    class="text-red-600 hover:text-red-800">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                  </button>
                </div>
                <button
                  type="button"
                  (click)="addTeamUser(i)"
                  class="text-sm text-blue-600 hover:text-blue-800">
                  + Agregar Usuario
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Products Section -->
      <div class="border-t border-gray-200 pt-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-medium text-gray-900">Productos</h3>
          <button
            type="button"
            (click)="addProduct()"
            class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-green-600 bg-green-50 border border-green-200 rounded-lg hover:bg-green-100 focus:outline-none focus:ring-2 focus:ring-green-500">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            Agregar Producto
          </button>
        </div>

        <div formArrayName="productos" class="space-y-4">
          <div *ngFor="let product of productosArray.controls; let i = index" [formGroupName]="i" class="bg-gray-50 p-4 rounded-lg">
            <div class="flex items-center justify-between mb-3">
              <h4 class="text-sm font-medium text-gray-700">Producto {{ i + 1 }}</h4>
              <button
                type="button"
                (click)="removeProduct(i)"
                class="text-red-600 hover:text-red-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Producto</label>
                <input
                  type="text"
                  formControlName="name"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Nombre del producto" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
                <input
                  type="number"
                  formControlName="quantity"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="0" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Precio Unitario</label>
                <input
                  type="number"
                  formControlName="unitPrice"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="0.00" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tasks Section -->
      <div class="border-t border-gray-200 pt-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-medium text-gray-900">Tareas</h3>
          <button
            type="button"
            (click)="addTask()"
            class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-purple-600 bg-purple-50 border border-purple-200 rounded-lg hover:bg-purple-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            Agregar Tarea
          </button>
        </div>

        <div formArrayName="tareas" class="space-y-4">
          <div *ngFor="let task of tareasArray.controls; let i = index" [formGroupName]="i" class="bg-gray-50 p-4 rounded-lg">
            <div class="flex items-center justify-between mb-3">
              <h4 class="text-sm font-medium text-gray-700">Tarea {{ i + 1 }}</h4>
              <button
                type="button"
                (click)="removeTask(i)"
                class="text-red-600 hover:text-red-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Título de la Tarea</label>
                <input
                  type="text"
                  formControlName="title"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Título de la tarea" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Prioridad</label>
                <select
                  formControlName="priority"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                  <option value="Baja">Baja</option>
                  <option value="Media">Media</option>
                  <option value="Alta">Alta</option>
                </select>
              </div>
            </div>

            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
              <textarea
                formControlName="description"
                rows="2"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Descripción de la tarea"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-200">
        <button
          type="button"
          (click)="closeModal()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="projectForm.invalid || isSubmitting"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="isSubmitting" class="inline-flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 2L14 6L18 6"></path>
            </svg>
            Guardando...
          </span>
          <span *ngIf="!isSubmitting">
            {{ project ? 'Actualizar' : 'Crear' }} Proyecto
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
