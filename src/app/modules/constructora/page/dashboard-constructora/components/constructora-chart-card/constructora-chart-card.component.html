<div class="bg-white rounded-lg shadow-md p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h3 class="text-lg font-semibold text-gray-900">Progreso de Tareas</h3>
      <p class="text-sm text-gray-500">Estado actual de las tareas del proyecto</p>
    </div>
  </div>

  <div *ngIf="isLoading" class="flex items-center justify-center h-64">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!isLoading" class="space-y-6">
    <!-- Gráfico de Barras -->
    <div class="flex justify-center">
      <apx-chart
        [series]="[{ name: 'Tareas', data: [taskStats.completed, taskStats.pending] }]"
        [chart]="{ type: 'bar', height: 280 }"
        [xaxis]="{ categories: ['Completadas', 'Pendientes'] }"
        [colors]="['#10B981', '#F59E0B']"
        [dataLabels]="{ enabled: true }"
        [legend]="{ show: false }">
      </apx-chart>
    </div>

    <!-- Estadísticas
    <div class="grid grid-cols-3 gap-4">
      <div class="text-center">
        <div class="text-2xl font-bold text-gray-900">{{ taskStats.total }}</div>
        <div class="text-sm text-gray-500">Total</div>
      </div>
      <div class="text-center">
        <div class="text-2xl font-bold text-green-600">{{ taskStats.completed }}</div>
        <div class="text-sm text-gray-500">Completadas</div>
      </div>
      <div class="text-center">
        <div class="text-2xl font-bold text-yellow-600">{{ taskStats.pending }}</div>
        <div class="text-sm text-gray-500">Pendientes</div>
      </div>
    </div>
    -->

    <!-- Barra de progreso -->
    <div class="space-y-2">
      <div class="flex justify-between text-sm">
        <span class="text-gray-600">Progreso general</span>
        <span class="font-medium text-gray-900">{{ taskStats.completionRate }}%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div 
          class="bg-gradient-to-r from-green-500 to-blue-500 h-2 rounded-full transition-all duration-300"
          [style.width.%]="taskStats.completionRate">
        </div>
      </div>
    </div>
  </div>
</div>
