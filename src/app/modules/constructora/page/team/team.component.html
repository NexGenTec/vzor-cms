<!-- Header Section -->
<div class="mb-6 flex justify-between items-center">
  <div class="inline-block">
    <h3 class="text-xl font-semibold text-foreground">Equipos</h3>
    <div class="text-xs font-medium text-muted-foreground">
      <a href="" class="hover:text-primary">Todos los equipos: </a>
      <span class="text-foreground">{{ totalTeamsCount() }}</span>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2 sm:space-x-4">
    <!-- Export PDF Button -->
    <button (click)="openExportConfirmation('pdf')"
      class="flex items-center justify-center rounded-md bg-muted px-4 py-2.5 text-xs font-semibold text-muted-foreground hover:text-foreground">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="#d32f2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-file-type-pdf">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M14 3v4a1 1 0 0 0 1 1h4" />
        <path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
        <path d="M5 18h1.5a1.5 1.5 0 0 0 0 -3h-1.5v6" />
        <path d="M17 18h2" />
        <path d="M20 15h-3v6" />
        <path d="M11 15v6h1a2 2 0 0 0 2 -2v-2a2 2 0 0 0 -2 -2h-1z" />
      </svg>
    </button>

    <!-- Export CSV Button -->
    <button (click)="openExportConfirmation('csv')"
      class="flex items-center justify-center rounded-md bg-muted px-4 py-2.5 text-xs font-semibold text-muted-foreground hover:text-foreground">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-file-type-csv">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M14 3v4a1 1 0 0 0 1 1h4" />
        <path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
        <path d="M7 16.5a1.5 1.5 0 0 0 -3 0v3a1.5 1.5 0 0 0 3 0" />
        <path d="M10 20.25c0 .414 .336 .75 .75 .75h1.25a1 1 0 0 0 1 -1v-1a1 1 0 0 0 -1 -1h-1a1 1 0 0 1 -1 -1v-1a1 1 0 0 1 1 -1h1.25a.75 .75 0 0 1 .75 .75" />
        <path d="M16 15l2 6l2 -6" />
      </svg>
    </button>

    <!-- Import Button -->
    <button (click)="triggerFileInput()"
      class="flex items-center justify-center rounded-md bg-muted px-4 py-2.5 text-xs font-semibold text-muted-foreground hover:text-foreground">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="ml-2">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M14 3v4a1 1 0 0 0 1 1h4" />
        <path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
        <path d="M7 16.5a1.5 1.5 0 0 0 -3 0v3a1.5 1.5 0 0 0 3 0" />
        <path d="M10 20.25c0 .414 .336 .75 .75 .75h1.25a1 1 0 0 0 1 -1v-1a1 1 0 0 0 -1 -1h-1a1 1 0 0 1 -1 -1v-1a1 1 0 0 1 1 -1h1.25a.75 .75 0 0 1 .75 .75" />
        <path d="M16 15l2 6l2 -6" />
      </svg>
    </button>

    <!-- Add Team Button -->
    <button (click)="openModal()"
      class="flex items-center justify-center rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground w-full sm:w-auto">
      Agregar Equipo
    </button>

    <!-- Export Confirmation Modal -->
    <app-modal 
      [isOpen]="isModalOpenExport"
      (confirm)="handleExportConfirmation(isExporting!)"
      (cancel)="isModalOpenExport = false">
    </app-modal>
  </div>
</div>

<!-- Loading Overlay -->
<div *ngIf="isLoading" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
  <div class="bg-white rounded-lg p-6 flex items-center gap-3">
    <svg class="animate-spin h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 2L14 6L18 6"></path>
    </svg>
    <span class="text-gray-700">Importando equipos...</span>
  </div>
</div>

<!-- Hidden File Input -->
<input type="file" #fileInput (change)="onFileSelected($event)" accept=".csv" class="hidden" />

<!-- Import Confirmation Modal -->
<div *ngIf="isModalOpenCSV" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
    <div class="flex items-center gap-3 mb-4">
      <div class="flex-shrink-0">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h3 class="text-lg font-medium text-gray-900">Confirmar Importación</h3>
    </div>
    <p class="text-sm text-gray-600 mb-6">¿Estás seguro de que deseas importar este archivo CSV? Esta acción no se puede deshacer.</p>
    <div class="flex justify-end gap-3">
      <button (click)="closeModalCsv()" 
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
        Cancelar
      </button>
      <button (click)="importCSV()" 
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
        Importar
      </button>
    </div>
  </div>
</div>

<!-- Add/Edit Team Modal -->
<app-add-team-modal 
  *ngIf="isModalOpen" 
  [team]="selectedTeam" 
  (closeModalEvent)="closeModal()"
  (saveTeam)="onTeamSaved($event)">
</app-add-team-modal>

<!-- Teams Table -->
<div class="flex min-w-full flex-col rounded-xl border border-muted/20 bg-background p-2">
  <app-team-action></app-team-action>
  <div class="scrollbar-thumb-rounded scrollbar-track-rounded grow overflow-x-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted">
    <table class="table w-full table-auto border-collapse border-0 text-left align-middle leading-5 text-muted-foreground">
      <thead class="border border-muted/20 text-xs text-muted-foreground">
        <tr app-team-header [allSelected]="allTeamsSelected()" (onCheck)="toggleTeams($event)"></tr>
      </thead>
      <tbody>
        <tr class="hover:bg-card/50" *ngFor="let team of pagedTeams()" 
            app-team-row 
            [team]="team" 
            [onEditTeam]="openEditModal.bind(this)" 
            (click)="toggleTeamSelection(team)">
        </tr>
        <tr *ngIf="filteredTeams().length === 0">
          <td class="py-4 text-center text-sm" colspan="7">No se encontraron equipos</td>
        </tr>
      </tbody>
    </table>
  </div>
  <app-team-footer
    [currentPage]="currentPage"
    [totalTeams]="totalTeams"
    [pageSize]="pageSize"
    (pageChanged)="changePage($event)"
    (pageSizeChanged)="changePageSize($event)">
  </app-team-footer>
</div>
