<!-- Checkbox para selección múltiple -->
<th class="text-center">
  <input
    type="checkbox"
    class="checkbox checkbox-sm"
    (change)="toggleAllTeams($event)"
    [checked]="allSelected" />
</th>

<!-- Nombre del equipo -->
<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Nombre</span>
</th>

<!-- Departamento -->
<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Departamento</span>
</th>

<!-- Estado -->
<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Estado</span>
</th>

<!-- Fecha de creación -->
<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Fecha</span>
</th>

<!-- Miembros -->
<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Miembros</span>
</th>

<!-- Acciones -->
<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Editar</span>
</th>

<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Eliminar</span>
</th>

<th class="text-left">
  <span class="text-xs font-medium text-muted-foreground">Ver</span>
</th>
