<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
    <!-- Modal Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">
        {{ team ? 'Editar Equipo' : 'Nuevo Equipo' }}
      </h2>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <form [formGroup]="teamForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      <!-- Basic Information Section -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Team Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
            Nombre del Equipo *
          </label>
          <input
            id="name"
            type="text"
            formControlName="name"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Ingrese el nombre del equipo"
            [class.border-red-500]="teamForm.get('name')?.invalid && teamForm.get('name')?.touched" />
          <div *ngIf="teamForm.get('name')?.invalid && teamForm.get('name')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="teamForm.get('name')?.errors?.['required']">El nombre es requerido</span>
            <span *ngIf="teamForm.get('name')?.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</span>
          </div>
        </div>

        <!-- Team Department -->
        <div>
          <label for="department" class="block text-sm font-medium text-gray-700 mb-2">
            Departamento *
          </label>
          <select
            id="department"
            formControlName="department"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="teamForm.get('department')?.invalid && teamForm.get('department')?.touched">
            <option value="">Seleccione un departamento</option>
            <option value="Desarrollo">Desarrollo</option>
            <option value="Diseño">Diseño</option>
            <option value="Marketing">Marketing</option>
            <option value="Ventas">Ventas</option>
            <option value="Soporte">Soporte</option>
            <option value="Recursos Humanos">Recursos Humanos</option>
            <option value="Finanzas">Finanzas</option>
            <option value="Operaciones">Operaciones</option>
            <option value="Otros">Otros</option>
          </select>
          <div *ngIf="teamForm.get('department')?.invalid && teamForm.get('department')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="teamForm.get('department')?.errors?.['required']">El departamento es requerido</span>
          </div>
        </div>

        <!-- Team Status -->
        <div>
          <label for="status" class="block text-sm font-medium text-gray-700 mb-2">
            Estado *
          </label>
          <select
            id="status"
            formControlName="status"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="teamForm.get('status')?.invalid && teamForm.get('status')?.touched">
            <option value="">Seleccione un estado</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
            <option value="En Formación">En Formación</option>
            <option value="Disuelto">Disuelto</option>
          </select>
          <div *ngIf="teamForm.get('status')?.invalid && teamForm.get('status')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="teamForm.get('status')?.errors?.['required']">El estado es requerido</span>
          </div>
        </div>
      </div>

      <!-- Team Description -->
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
          Descripción
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Descripción del equipo"></textarea>
      </div>

      <!-- Team Members Section -->
      <div class="border-t border-gray-200 pt-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-medium text-gray-900">Miembros del Equipo</h3>
          <button
            type="button"
            (click)="addMember()"
            class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-blue-600 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            Agregar Miembro
          </button>
        </div>

        <div formArrayName="members" class="space-y-4">
          <div *ngFor="let member of membersArray.controls; let i = index" [formGroupName]="i" class="bg-gray-50 p-4 rounded-lg">
            <div class="flex items-center justify-between mb-3">
              <h4 class="text-sm font-medium text-gray-700">Miembro {{ i + 1 }}</h4>
              <button
                type="button"
                (click)="removeMember(i)"
                class="text-red-600 hover:text-red-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                <input
                  type="text"
                  formControlName="name"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Nombre del miembro" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input
                  type="email"
                  formControlName="email"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Email del miembro" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
                <input
                  type="text"
                  formControlName="role"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Rol en el equipo" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                <input
                  type="tel"
                  formControlName="phone"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Teléfono (opcional)" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-200">
        <button
          type="button"
          (click)="closeModal()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="teamForm.invalid || isSubmitting"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="isSubmitting" class="inline-flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 2L14 6L18 6"></path>
            </svg>
            Guardando...
          </span>
          <span *ngIf="!isSubmitting">
            {{ team ? 'Actualizar' : 'Crear' }} Equipo
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
