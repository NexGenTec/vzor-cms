<div class="flex flex-wrap items-center justify-between gap-2 py-3 px-5">
    <h3 class="text-sm font-medium text-muted-foreground">
      Mostrando {{ filteredUsers.length }} de {{ users.length }} usuarios
    </h3>
    <div class="flex flex-wrap gap-2">
      <div class="flex">
        <label class="relative text-muted-foreground">
          <div class="absolute left-2.5 top-2.5">
            <svg-icon 
              src="./../../../../../../assets/icons/heroicons/outline/magnifying-glass.svg" 
              [svgClass]="'h-4 w-4'">
            </svg-icon>
          </div>
          <input
            name="search"
            class="py-2 pl-8 pr-2"
            placeholder="Buscar usuarios"
            type="text"
            (input)="onSearchChange($event)" />
        </label>
      </div>
      <div class="flex flex-wrap gap-2.5">
        <select name="role" class="w-28 p-2 text-muted-foreground" (change)="onRoleChange($event)">
          <option value="">Todos los roles</option>
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
        <select name="order" class="w-28 p-2 text-muted-foreground" (change)="onOrderChange($event)">
          <option value="1">Más reciente</option>
          <option value="2">Más antiguo</option>
          <option value="3">Nombre A-Z</option>
          <option value="4">Nombre Z-A</option>
        </select>
      </div>
    </div>
</div>
