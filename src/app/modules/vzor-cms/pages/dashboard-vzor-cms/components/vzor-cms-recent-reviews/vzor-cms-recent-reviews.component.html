<div class="recent-reviews-card">
  <div class="card-header">
    <h3 class="card-title">Reseñas Recientes</h3>
    <a href="/layout/vzor-cms/review-clientes" class="view-all-link">Ver todas</a>
  </div>
  
  <div class="card-content">
    <div *ngIf="reviews.length === 0" class="empty-state">
      <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.329 1.176l1.519 4.674c.3.921-.755 1.688-1.539 1.175l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.513-1.838-.254-1.539-1.175l1.519-4.674a1 1 0 00-.329-1.176l-3.976-2.888c-.784-.57-.381-1.81.588-1.81h4.915a1 1 0 00.95-.69l1.519-4.674z"></path>
      </svg>
      <p>No hay reseñas disponibles</p>
    </div>
    
    <div *ngIf="reviews.length > 0" class="reviews-list">
      <div *ngFor="let review of reviews" class="review-item">
        <div class="review-content">
          <div class="review-header">
            <h4 class="client-name">{{ review.clientName }}</h4>
            <div class="rating-stars">
              <svg
                *ngFor="let star of getStars(review.rating)"
                [class.filled-star]="star"
                class="star-icon w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.329 1.176l1.519 4.674c.3.921-.755 1.688-1.539 1.175l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.513-1.838-.254-1.539-1.175l1.519-4.674a1 1 0 00-.329-1.176l-3.976-2.888c-.784-.57-.381-1.81.588-1.81h4.915a1 1 0 00.95-.69l1.519-4.674z"></path>
              </svg>
            </div>
          </div>
          <p class="review-text">{{ review.review }}</p>
          <div class="review-meta">
            <span class="project-name">{{ review.project }}</span>
            <span class="review-date">{{ formatDate(review.createdAt) }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
