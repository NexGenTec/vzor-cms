<div class="flex-col rounded-lg bg-background px-8 py-8 sm:flex-row">
  <div class="mb-4 flex items-center justify-between">
    <div class="flex-col items-center">
      <h3 class="text-md font-bold text-foreground">Lista de Contenido</h3>
      <span class="text-xs text-muted-foreground">Actualizado hace un momento</span>
    </div>
    <button
      class="flex-none rounded-md px-4 py-2.5 text-xs font-semibold text-white hover:opacity-90 transition"
      [style.background-color]="'#6EC1E4'"
      [routerLink]="['/vzor-cms/recursos']">
      Agregar Contenido
    </button>
  </div>  

  <!-- Contenido de la tabla -->
  <div class="relative overflow-x-auto">
    <!-- Esqueleto de carga -->
    <div *ngIf="isLoading" class="space-y-4">
      <div class="h-8 w-3/4 rounded bg-gray-200 animate-pulse"></div>
      <div class="h-6 w-full rounded bg-gray-200 animate-pulse"></div>
      <div class="h-6 w-full rounded bg-gray-200 animate-pulse"></div>
      <div class="h-6 w-3/4 rounded bg-gray-200 animate-pulse"></div>
    </div>

    <!-- Mensaje de no hay contenido -->
    <div *ngIf="!isLoading && contentItems.length === 0" class="text-center text-muted-foreground py-8">
      <p class="text-md font-semibold">No hay contenido agregado</p>
    </div>

    <!-- Tabla de contenido -->
    <table *ngIf="!isLoading && contentItems.length > 0" class="w-full table-auto">
      <thead class="text-xs uppercase text-muted-foreground">
        <tr>
          <th class="py-3 text-left">Título</th>
          <th class="py-3 text-left">Tipo</th>
          <th class="py-3 text-left">Categoría</th>
          <th class="py-3 text-left">Estado</th>
          <th class="py-3 text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of contentItems.slice(0, 5)" class="border-b border-dashed border-border hover:bg-card">
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <a class="text-sm font-semibold text-foreground hover:text-primary" href="#">
              {{ item.title }}
            </a>
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <span class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
              [ngClass]="{
                'bg-blue-500/10 text-blue-800': item.type === 'blog',
                'bg-green-500/10 text-green-800': item.type === 'recurso',
                'bg-purple-500/10 text-purple-800': item.type === 'review'
              }">
              {{ item.type === 'blog' ? 'Post' : item.type === 'recurso' ? 'Recurso' : 'Reseña' }}
            </span>
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <span class="text-xs font-medium text-muted-foreground/70">
              {{ item.category }}
            </span>
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <span class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
            [ngClass]="item.status === 'Publicado' || item.status === 'Disponible' || item.status === 'Activa' ? 'bg-green-500/10 text-green-800' : 'bg-blue-500/10 text-blue-800'">
            {{ item.status }}
          </span>            
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-right border-b border-muted/20">
            <div class="flex justify-end">
              <button
                class="hover:bg-primary-600 flex-none rounded-md bg-primary px-2 py-2 text-xs font-semibold text-primary-foreground"
                [routerLink]="[getRoute(item.type)]">
                <svg-icon src="assets/icons/heroicons/outline/arrow-sm-right.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
              </button>
            </div>
          </td>
        </tr>        
      </tbody>
    </table>
  </div>
</div>
