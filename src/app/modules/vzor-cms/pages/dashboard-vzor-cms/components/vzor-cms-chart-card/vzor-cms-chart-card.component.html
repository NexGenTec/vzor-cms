<div class="bg-white rounded-lg shadow-md p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h3 class="text-lg font-semibold text-gray-900">Progreso de Contenido</h3>
      <p class="text-sm text-gray-500">Estado actual del contenido del CMS</p>
    </div>
  </div>

  <div *ngIf="isLoading" class="flex items-center justify-center h-64">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!isLoading" class="space-y-6">
    <!-- Gráfico de Barras -->
    <div class="flex justify-center">
      <apx-chart
        [series]="[{ name: 'Contenido', data: [contentStats.posts, contentStats.recursos, contentStats.reviews] }]"
        [chart]="{ type: 'bar', height: 280 }"
        [xaxis]="{ categories: ['Posts', 'Recursos', 'Reseñas'] }"
        [colors]="['#3B82F6', '#10B981', '#8B5CF6']"
        [dataLabels]="{ enabled: true }"
        [legend]="{ show: false }">
      </apx-chart>
    </div>

    <!-- Barra de progreso -->
    <div class="space-y-2">
      <div class="flex justify-between text-sm">
        <span class="text-gray-600">Progreso general</span>
        <span class="font-medium text-gray-900">{{ contentStats.completionRate }}%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div 
          class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full transition-all duration-300"
          [style.width.%]="contentStats.completionRate">
        </div>
      </div>
    </div>
  </div>
</div>
