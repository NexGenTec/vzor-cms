<div class="recent-recursos-card">
  <div class="card-header">
    <h3 class="card-title">Recursos Recientes</h3>
    <a href="/layout/vzor-cms/recursos" class="view-all-link">Ver todos</a>
  </div>
  
  <div class="card-content">
    <div *ngIf="recursos.length === 0" class="empty-state">
      <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      <p>No hay recursos disponibles</p>
    </div>
    
    <div *ngIf="recursos.length > 0" class="recursos-list">
      <div *ngFor="let recurso of recursos" class="recurso-item">
        <div class="recurso-icon">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="recurso.type === 'PDF'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            <path *ngIf="recurso.type === 'Excel'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
            <path *ngIf="recurso.type === 'Video'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            <path *ngIf="recurso.type === 'Software'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
            <path *ngIf="recurso.type === 'Imagen'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <div class="recurso-content">
          <h4 class="recurso-title">{{ recurso.title }}</h4>
          <p class="recurso-description">{{ recurso.description }}</p>
          <div class="recurso-meta">
            <span class="recurso-downloads">{{ recurso.downloads }} descargas</span>
            <span class="recurso-date">{{ formatDate(recurso.createdAt) }}</span>
          </div>
        </div>
        <div class="recurso-type">{{ recurso.type }}</div>
      </div>
    </div>
  </div>
</div>
