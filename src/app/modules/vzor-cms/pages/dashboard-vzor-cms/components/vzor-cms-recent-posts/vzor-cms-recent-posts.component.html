<div class="recent-posts-card">
  <div class="card-header">
    <h3 class="card-title">Posts Recientes</h3>
    <a href="/layout/vzor-cms/blog" class="view-all-link">Ver todos</a>
  </div>
  
  <div class="card-content">
    <div *ngIf="posts.length === 0" class="empty-state">
      <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-3m-2 4H5m5 0h9"></path>
      </svg>
      <p>No hay posts disponibles</p>
    </div>
    
    <div *ngIf="posts.length > 0" class="posts-list">
      <div *ngFor="let post of posts" class="post-item">
        <div class="post-content">
          <h4 class="post-title">{{ post.title }}</h4>
          <p class="post-excerpt">{{ post.excerpt }}</p>
          <div class="post-meta">
            <span class="post-author">{{ post.author }}</span>
            <span class="post-date">{{ formatDate(post.createdAt) }}</span>
          </div>
        </div>
        <div class="post-category">
          {{ post.category }}
        </div>
      </div>
    </div>
  </div>
</div>
