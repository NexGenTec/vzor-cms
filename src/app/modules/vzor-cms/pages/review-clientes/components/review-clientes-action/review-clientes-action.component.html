<div class="flex items-center justify-between p-4">
  <div class="flex items-center space-x-4">
    <div class="relative">
      <input 
        type="text" 
        placeholder="Buscar reseñas..." 
        class="w-64 rounded-md border border-muted/20 bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary"
        (input)="onSearchChange($event)">
    </div>
    <select 
      class="rounded-md border border-muted/20 bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
      (change)="onProjectTypeChange($event)">
      <option value="Todas">Todos los tipos</option>
      <option value="Residencial">Residencial</option>
      <option value="Comercial">Comercial</option>
      <option value="Corporativo">Corporativo</option>
      <option value="Industrial">Industrial</option>
    </select>
    <select 
      class="rounded-md border border-muted/20 bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
      (change)="onRatingChange($event)">
      <option value="Todas">Todas las calificaciones</option>
      <option value="5 estrellas">5 estrellas</option>
      <option value="4 estrellas">4 estrellas</option>
      <option value="3 estrellas">3 estrellas</option>
      <option value="2 estrellas">2 estrellas</option>
      <option value="1 estrella">1 estrella</option>
    </select>
  </div>
  <div class="text-sm text-muted-foreground">
    Mostrando {{ totalReviews }} reseñas
  </div>
</div>
