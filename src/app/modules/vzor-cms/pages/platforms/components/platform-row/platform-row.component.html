<ng-container>
    <td class="px-3 py-4">
        <input type="checkbox" [(ngModel)]="platform.selected"
            class="h-4 w-4 rounded border-muted text-primary focus:ring-2 focus:ring-primary focus:ring-offset-0" />
    </td>

    <td class="px-3 py-4">
        <div class="w-12 h-12 rounded-lg bg-gray-100 flex items-center justify-center overflow-hidden">
            <img *ngIf="platform.iconUrl" [src]="platform.iconUrl" [alt]="platform.name"
                class="w-full h-full object-contain" />
            <svg *ngIf="!platform.iconUrl" class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                </path>
            </svg>
        </div>
    </td>

    <td class="px-3 py-4">
        <div class="max-w-md">
            <p class="font-medium text-foreground">{{ platform.name }}</p>
            <p class="text-xs text-muted-foreground mt-1 line-clamp-2">{{ platform.description || 'Sin descripción' }}
            </p>
        </div>
    </td>

    <td class="px-3 py-4 text-center">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
            {{ platform.solutions.length }} soluciones
        </span>
    </td>

    <td class="px-3 py-4 text-center">
        <span class="text-sm font-medium text-foreground">{{ platform.order }}</span>
    </td>

    <td class="px-3 py-4 text-center">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
            [ngClass]="platform.isActive ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'">
            {{ platform.isActive ? 'Activa' : 'Inactiva' }}
        </span>
    </td>

    <td class="py-4 px-3">
        <button class="flex h-8 w-8 items-center justify-center rounded-md transition-colors"
            style="color: #6EC1E4; background-color: rgba(110, 193, 228, 0.1);"
            onmouseover="this.style.backgroundColor='rgba(110, 193, 228, 0.2)'"
            onmouseout="this.style.backgroundColor='rgba(110, 193, 228, 0.1)'" (click)="onView()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" />
            </svg>
        </button>
    </td>

    <td class="py-4 px-3">
        <button class="flex h-8 w-8 items-center justify-center rounded-md transition-colors"
            style="color: #6EC1E4; background-color: rgba(110, 193, 228, 0.1);"
            onmouseover="this.style.backgroundColor='rgba(110, 193, 228, 0.2)'"
            onmouseout="this.style.backgroundColor='rgba(110, 193, 228, 0.1)'" (click)="onEdit()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" />
                <path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" />
                <path d="M16 5l3 3" />
            </svg>
        </button>
    </td>

    <td class="py-4 px-3">
        <button class="flex h-8 w-8 items-center justify-center rounded-md transition-colors"
            style="color: #6EC1E4; background-color: rgba(110, 193, 228, 0.1);"
            onmouseover="this.style.backgroundColor='rgba(110, 193, 228, 0.2)'"
            onmouseout="this.style.backgroundColor='rgba(110, 193, 228, 0.1)'" (click)="onDelete()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7l16 0" />
                <path d="M10 11l0 6" />
                <path d="M14 11l0 6" />
                <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
            </svg>
        </button>
    </td>
</ng-container>
