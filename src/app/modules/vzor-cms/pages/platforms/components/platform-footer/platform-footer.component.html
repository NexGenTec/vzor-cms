<div class="flex items-center justify-between p-4">
    <div class="flex items-center space-x-2">
        <span class="text-sm text-muted-foreground">Mostrar</span>
        <select
            class="rounded-md border border-muted/20 bg-background px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            [value]="pageSize" (change)="onPageSizeChange($event)">
            <option [value]="5">5</option>
            <option [value]="10">10</option>
            <option [value]="20">20</option>
            <option [value]="50">50</option>
        </select>
        <span class="text-sm text-muted-foreground">por página</span>
    </div>

    <div class="flex items-center space-x-2">
        <span class="text-sm text-muted-foreground">
            Página {{ currentPage }} de {{ totalPages() }}
        </span>
        <div class="flex space-x-1">
            <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1"
                class="rounded-md border border-muted/20 bg-background px-3 py-1 text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-muted">
                Anterior
            </button>
            <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === totalPages()"
                class="rounded-md border border-muted/20 bg-background px-3 py-1 text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-muted">
                Siguiente
            </button>
        </div>
    </div>
</div>
