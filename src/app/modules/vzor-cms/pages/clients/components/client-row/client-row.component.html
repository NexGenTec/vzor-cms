<ng-container>
    <td class="py-4 px-3 text-center">
        <input type="checkbox" [(ngModel)]="client.selected"
            class="h-4 w-4 rounded border-muted text-primary focus:ring-2 focus:ring-primary focus:ring-offset-0" />
    </td>

    <td class="py-4 px-3 text-center">
        <div class="w-10 h-10 rounded bg-gray-100 flex items-center justify-center overflow-hidden mx-auto">
            <img *ngIf="client.logoUrl" [src]="client.logoUrl" [alt]="client.name"
                class="w-full h-full object-contain" />
            <div *ngIf="!client.logoUrl" class="w-full h-full flex items-center justify-center">
                <span class="text-xs font-semibold text-gray-400">{{ (client.name || 'C')[0].toUpperCase() }}</span>
            </div>
        </div>
    </td>

    <td class="min-w-[200px] py-4 px-3">
        <div class="flex flex-col min-w-0">
            <p class="text-sm font-semibold text-foreground truncate">{{ client.name }}</p>
            <p class="text-xs text-muted-foreground/70 mt-0.5 line-clamp-1 truncate">{{ client.description || 'Sin descripción' }}</p>
        </div>
    </td>

    <td class="py-4 px-3 text-center">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
            [ngClass]="client.isPublished ? 'bg-green-50 text-green-700' : 'bg-gray-50 text-gray-600'">
            <span class="w-1.5 h-1.5 rounded-full mr-1.5"
                [ngClass]="client.isPublished ? 'bg-green-500' : 'bg-gray-400'"></span>
            {{ client.isPublished ? 'Activo' : 'Inactivo' }}
        </span>
    </td>

    <td class="py-4 px-3">
        <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span class="text-sm font-medium text-muted-foreground">
                {{ getFormattedDate(client.createdAt) | date:'short' || 'Sin fecha' }}
            </span>
        </div>
    </td>

    <td class="py-4 px-3 text-center">
        <button class="flex h-7 w-7 items-center justify-center rounded transition-colors hover:bg-gray-100 mx-auto"
            style="color: #6EC1E4;" (click)="onEdit()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" />
                <path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" />
                <path d="M16 5l3 3" />
            </svg>
        </button>
    </td>

    <td class="py-4 px-3 text-center">
        <button class="flex h-7 w-7 items-center justify-center rounded transition-colors hover:bg-red-50 mx-auto"
            style="color: #ef4444;" (click)="onDelete()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7l16 0" />
                <path d="M10 11l0 6" />
                <path d="M14 11l0 6" />
                <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
            </svg>
        </button>
    </td>

    <td class="py-4 px-3 text-center">
        <button
            class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold text-white hover:opacity-90 transition-opacity"
            style="background-color: #6EC1E4;" (click)="onView()">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
            </svg>
            Ver
        </button>
    </td>
</ng-container>

<app-confirm-modal 
    [isOpen]="showDeleteModal"
    title="Eliminar Cliente"
    message="¿Estás seguro de que quieres eliminar este cliente? Esta acción no se puede deshacer."
    confirmText="Eliminar"
    cancelText="Cancelar"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()">
</app-confirm-modal>
