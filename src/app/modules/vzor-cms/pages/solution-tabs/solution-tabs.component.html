<div class="mb-6 flex justify-between items-center">
  <div class="inline-block">
    <h3 class="text-xl font-semibold text-foreground">Tabs de Soluciones</h3>
    <div class="text-xs font-medium text-muted-foreground">
      <span class="hover:text-primary">Total de Tabs: </span>
      <span class="text-foreground">{{ filteredSolutionTabs().length }}</span>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2 sm:space-x-4">
    <button
      (click)="openModal()"
      class="flex items-center justify-center rounded-md px-4 py-2.5 text-xs font-semibold text-white w-full sm:w-auto"
      [style.background-color]="'#6EC1E4'">
      Agregar Tab
    </button>
  </div>
</div>

<div class="flex min-w-full flex-col rounded-xl border border-muted/20 bg-background p-2">
  <app-solution-tab-action
    [totalSolutionTabs]="totalSolutionTabs"
    (searchChange)="onSearchChange($event)">
  </app-solution-tab-action>

  <div
    class="scrollbar-thumb-rounded scrollbar-track-rounded grow overflow-x-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted">
    <table
      class="table w-full table-auto border-collapse border-0 text-left align-middle leading-5 text-muted-foreground">
      <thead class="border border-muted/20 text-xs text-muted-foreground">
        <tr app-solution-tab-header (onCheck)="toggleSolutionTabs($event)"></tr>
      </thead>
      <tbody>
        <tr
          class="hover:bg-card/50"
          *ngFor="let tab of pagedSolutionTabs(); let i = index"
          app-solution-tab-row
          [tab]="tab"
          (editTab)="openEditModal($event)"
          (viewTab)="viewSolutionTab($event)"
          (deleteTab)="deleteSolutionTab($event)">
        </tr>
        <tr *ngIf="filteredSolutionTabs().length === 0">
          <td class="py-4 text-center text-sm" colspan="8">No se encontraron tabs de soluciones</td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-solution-tab-footer
    [currentPage]="currentPage"
    [totalSolutionTabs]="totalSolutionTabs"
    [pageSize]="pageSize"
    (pageChanged)="changePage($event)"
    (pageSizeChanged)="changePageSize($event)">
  </app-solution-tab-footer>
</div>
