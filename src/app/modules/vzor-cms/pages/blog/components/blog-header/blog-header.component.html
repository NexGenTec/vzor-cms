<ng-container>
  <!-- Columna para seleccionar filas -->
  <th class="w-[50px] px-3 py-4 text-center">
    <input (change)="onCheckChange($event)" class="checkbox checkbox-sm" data-datatable-check="true" type="checkbox" />
  </th>
  <!-- Columna para el título del post -->
  <th class="min-w-[300px] px-3 py-4 text-left">Título</th>
  <!-- Columna para el autor -->
  <th class="min-w-[150px] px-3 py-4 text-left">Autor</th>
  <!-- Columna para la categoría -->
  <th class="min-w-[120px] px-3 py-4 text-left">Categoría</th>
  <!-- Columna para el estado -->
  <th class="min-w-[120px] px-3 py-4 text-left">Estado</th>
  <!-- Columna para la fecha -->
  <th class="min-w-[140px] px-3 py-4 text-left">Fecha Creación</th>
  <!-- Columna para editar -->
  <th class="w-[80px] px-3 py-4 text-center">Editar</th>
  <!-- Columna para eliminar -->
  <th class="w-[80px] px-3 py-4 text-center">Eliminar</th>
  <!-- Columna para ver -->
  <th class="w-[90px] px-3 py-4 text-center">Ver</th>
</ng-container>
