<div class="mb-6 flex justify-between items-center">
    <div class="inline-block">
        <h3 class="text-xl font-semibold text-foreground">Socios Comerciales</h3>
        <div class="text-xs font-medium text-muted-foreground">
            <a href="" class="hover:text-primary">Total de Socios: </a>
            <span class="text-foreground">{{ filteredPartners().length }}</span>
        </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 sm:space-x-4">
        <button (click)="openModal()"
            class="flex items-center justify-center rounded-md px-4 py-2.5 text-xs font-semibold text-white w-full sm:w-auto"
            [style.background-color]="'#6EC1E4'">
            Agregar Socio
        </button>
    </div>
</div>

<div class="flex min-w-full flex-col rounded-xl border border-muted/20 bg-background p-2">
    <app-partner-action [totalPartners]="totalPartners" (searchChange)="onSearchChange($event)"
        (statusChange)="onStatusChange($event)">
    </app-partner-action>
    <div
        class="scrollbar-thumb-rounded scrollbar-track-rounded grow overflow-x-auto scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted">
        <table
            class="table w-full table-auto border-collapse border-0 text-left align-middle leading-5 text-muted-foreground">
            <thead class="border border-muted/20 text-xs text-muted-foreground">
                <tr app-partner-header (onCheck)="togglePartners($event)"></tr>
            </thead>
            <tbody>
                <tr class="hover:bg-card/50" *ngFor="let partner of pagedPartners(); let i=index" app-partner-row
                    [partner]="partner" (editPartner)="openEditModal($event)" (viewPartner)="viewPartner($event)"
                    (deletePartner)="deletePartner($event)">
                </tr>
                <tr *ngIf="filteredPartners().length === 0">
                    <td class="py-4 text-center text-sm" colspan="8">No se encontraron socios</td>
                </tr>
            </tbody>
        </table>
    </div>
    <app-partner-footer [currentPage]="currentPage" [totalPartners]="totalPartners" [pageSize]="pageSize"
        (pageChanged)="changePage($event)" (pageSizeChanged)="changePageSize($event)">
    </app-partner-footer>
</div>
