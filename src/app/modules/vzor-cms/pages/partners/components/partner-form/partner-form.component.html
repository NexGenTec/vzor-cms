<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button (click)="goBack()"
                        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-colors">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">
                            {{ isEditMode ? 'Editar Socio' : 'Crear Nuevo Socio' }}
                        </h1>
                        <p class="text-sm text-gray-600">
                            {{ isEditMode ? 'Modifica la información del socio' : 'Completa la información para
                            registrar un nuevo socio' }}
                        </p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button type="button" (click)="goBack()"
                        class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                        Cancelar
                    </button>
                    <button type="button" (click)="onSubmit()" [disabled]="partnerForm.invalid || isLoading"
                        class="px-6 py-2 text-white rounded-lg hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed"
                        style="background-color: #6EC1E4;">
                        <span *ngIf="!isLoading">{{ isEditMode ? 'Actualizar' : 'Crear Socio' }}</span>
                        <span *ngIf="isLoading">Guardando...</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Form -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <form [formGroup]="partnerForm" (ngSubmit)="onSubmit()" class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                            Nombre del Socio <span class="text-red-500">*</span>
                        </label>
                        <input id="name" formControlName="name" type="text"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Nombre de la empresa" />
                        <div *ngIf="partnerForm.get('name')?.invalid && partnerForm.get('name')?.touched"
                            class="mt-1 text-sm text-red-600">
                            El nombre es obligatorio.
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                            Descripción <span class="text-red-500">*</span>
                        </label>
                        <textarea id="description" formControlName="description"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Breve descripción del socio" rows="3"></textarea>
                        <div *ngIf="partnerForm.get('description')?.invalid && partnerForm.get('description')?.touched"
                            class="mt-1 text-sm text-red-600">
                            La descripción es obligatoria.
                        </div>
                    </div>

                    <div>
                        <label for="website" class="block text-sm font-medium text-gray-700 mb-2">
                            Sitio Web <span class="text-red-500">*</span>
                        </label>
                        <input id="website" formControlName="website" type="url"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="https://ejemplo.com" />
                    </div>

                    <div>
                        <label for="order" class="block text-sm font-medium text-gray-700 mb-2">
                            Orden <span class="text-red-500">*</span>
                        </label>
                        <input id="order" formControlName="order" type="number"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="0" />
                    </div>

                    <div>
                        <label for="isVisible" class="block text-sm font-medium text-gray-700 mb-2">
                            Visibilidad
                        </label>
                        <div class="flex items-center h-10">
                            <input id="isVisible" formControlName="isVisible" type="checkbox"
                                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
                            <label for="isVisible" class="ml-2 text-sm text-gray-700">Visible en web</label>
                        </div>
                    </div>

                    <!-- Logo Upload -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Logo del Socio
                        </label>
                        <div *ngIf="logoPreview" class="mb-4">
                            <div class="flex items-center gap-4">
                                <div
                                    class="w-32 h-32 rounded-lg bg-gray-100 flex items-center justify-center overflow-hidden border-2 border-gray-200 p-2">
                                    <img [src]="logoPreview" alt="Preview" class="w-full h-full object-contain" />
                                </div>
                                <button type="button" (click)="removeLogo()"
                                    class="text-red-600 hover:text-red-700 text-sm font-medium">
                                    Eliminar logo
                                </button>
                            </div>
                        </div>
                        <input type="file" id="logoInput" accept="image/*" (change)="onLogoSelected($event)"
                            class="hidden" #logoInput>
                        <button type="button" (click)="logoInput.click()" [disabled]="isUploadingLogo"
                            class="flex items-center px-4 py-2 border border-gray-300 rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition-colors disabled:opacity-50">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            {{ isUploadingLogo ? 'Subiendo...' : 'Subir Logo' }}
                        </button>
                        <p class="text-xs text-gray-500 mt-2">Máximo 2MB. Formatos: PNG, JPG, SVG</p>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
