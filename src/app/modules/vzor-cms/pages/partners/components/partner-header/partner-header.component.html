<ng-container>
    <th class="w-[50px] px-3 py-4">
        <input type="checkbox" (change)="onCheckChange($event)"
            class="h-4 w-4 rounded border-muted text-primary focus:ring-2 focus:ring-primary focus:ring-offset-0" />
    </th>
    <th class="w-[80px] px-3 py-4">Logo</th>
    <th class="px-3 py-4 text-left">Nombre</th>
    <th class="w-[100px] px-3 py-4 text-center">Orden</th>
    <th class="w-[120px] px-3 py-4 text-center">Estado</th>
    <th class="w-[80px] px-3 py-4 text-center">Ver</th>
    <th class="w-[80px] px-3 py-4 text-center">Editar</th>
    <th class="w-[80px] px-3 py-4 text-center">Eliminar</th>
</ng-container>
