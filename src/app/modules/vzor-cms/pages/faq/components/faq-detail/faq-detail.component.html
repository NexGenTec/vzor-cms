<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button (click)="goBack()"
                        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-300 bg-white text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-colors">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Detalle de FAQ</h1>
                        <p class="text-sm text-gray-600">Información detallada de la pregunta frecuente</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button (click)="editFaq()"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 00 2 2h11a2 2 0 00 2-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        Editar
                    </button>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div *ngIf="isLoading" class="flex justify-center items-center py-12">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        </div>

        <div *ngIf="!isLoading && faq" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 space-y-6">

                <!-- Status Badge -->
                <div class="flex justify-end">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                        [ngClass]="faq.isPublished ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'">
                        {{ faq.isPublished ? 'Publicado' : 'Borrador' }}
                    </span>
                </div>

                <!-- Question -->
                <div>
                    <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Pregunta</h3>
                    <p class="text-lg font-medium text-gray-900">{{ faq.question }}</p>
                </div>

                <!-- Answer -->
                <div>
                    <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Respuesta</h3>
                    <div class="prose max-w-none text-gray-700 bg-gray-50 p-4 rounded-lg">
                        {{ faq.answer }}
                    </div>
                </div>

                <!-- Metadata Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6 border-t border-gray-100">
                    <div>
                        <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Categoría</h3>
                        <span
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                            {{ faq.category }}
                        </span>
                    </div>

                    <div>
                        <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Orden</h3>
                        <p class="text-gray-900">{{ faq.order }}</p>
                    </div>

                    <div>
                        <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Última Actualización
                        </h3>
                        <p class="text-gray-900">{{ faq.updatedAt | date:'medium' }}</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
