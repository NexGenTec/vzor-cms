<div class="flex items-center justify-between p-4">
    <div class="flex items-center space-x-4">
        <div class="relative">
            <input type="text" placeholder="Buscar recursos..."
                class="w-64 rounded-md border border-muted/20 bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary"
                (input)="onSearchChange($event)">
        </div>
        <select
            class="rounded-md border border-muted/20 bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            (change)="onCategoryChange($event)">
            <option value="Todas">Todas las categorías</option>
            <option value="Documentación">Documentación</option>
            <option value="Formación">Formación</option>
            <option value="Marketing">Marketing</option>
            <option value="Técnico">Técnico</option>
        </select>
        <select
            class="rounded-md border border-muted/20 bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            (change)="onTypeChange($event)">
            <option value="Todas">Todos los tipos</option>
            <option value="Documento">Documento</option>
            <option value="Imagen">Imagen</option>
            <option value="Video">Video</option>
        </select>
    </div>
    <div class="text-sm text-muted-foreground">
        Mostrando {{ totalRecursos }} recursos
    </div>
</div>
