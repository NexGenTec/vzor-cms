<ng-container>
    <!-- Checkbox para selección -->
    <td class="text-center py-4 px-3">
        <input class="checkbox checkbox-sm" data-datatable-row-check="true" type="checkbox" [value]="recurso.id" />
    </td>

    <!-- Información del recurso (Título y descripción) -->
    <td class="py-4 px-3">
        <div class="flex flex-col min-w-0">
            <a class="text-sm font-semibold text-foreground hover:text-primary line-clamp-1" href="#">
                {{ recurso.title }}
            </a>
            <div class="mt-1 text-xs text-muted-foreground/70 line-clamp-1">
                {{ recurso.description || 'Sin descripción' }}
            </div>
        </div>
    </td>

    <!-- Tipo -->
    <td class="py-4 px-3">
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4 flex-shrink-0" [ngClass]="{
        'text-blue-500': getTypeColor(recurso.type) === 'blue',
        'text-green-500': getTypeColor(recurso.type) === 'green',
        'text-purple-500': getTypeColor(recurso.type) === 'purple'
      }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    [attr.d]="getTypeIcon(recurso.type)"></path>
            </svg>
            <span class="text-sm font-medium text-muted-foreground">
                {{ recurso.type }}
            </span>
        </div>
    </td>

    <!-- Categoría -->
    <td class="py-4 px-3">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium" [ngClass]="{
        'bg-blue-100 text-blue-800': recurso.category === 'Documentación',
        'bg-green-100 text-green-800': recurso.category === 'Formación',
        'bg-yellow-100 text-yellow-800': recurso.category === 'Marketing',
        'bg-purple-100 text-purple-800': recurso.category === 'Técnico'
      }">
            {{ recurso.category || 'Sin categoría' }}
        </span>
    </td>

    <!-- Descargas -->
    <td class="py-4 px-3 text-center">
        <div class="flex items-center justify-center gap-1">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
            </svg>
            <span class="text-sm font-semibold text-foreground">
                {{ recurso.downloads || 0 }}
            </span>
        </div>
    </td>

    <!-- Fecha de Creación -->
    <td class="py-4 px-3">
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span class="text-sm font-medium text-muted-foreground">
                {{ getFormattedDate(recurso.createdAt) | date:'short' || 'Sin fecha' }}
            </span>
        </div>
    </td>

    <!-- Botón de editar -->
    <td class="py-4 px-3">
        <button class="flex h-8 w-8 items-center justify-center rounded-md transition-colors"
            style="color: #6EC1E4; background-color: rgba(110, 193, 228, 0.1);"
            onmouseover="this.style.backgroundColor='rgba(110, 193, 228, 0.2)'"
            onmouseout="this.style.backgroundColor='rgba(110, 193, 228, 0.1)'" (click)="onEdit()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" />
                <path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" />
                <path d="M16 5l3 3" />
            </svg>
        </button>
    </td>

    <!-- Botón de eliminar -->
    <td class="py-4 px-3">
        <button class="flex h-8 w-8 items-center justify-center rounded-md transition-colors"
            style="color: #6EC1E4; background-color: rgba(110, 193, 228, 0.1);"
            onmouseover="this.style.backgroundColor='rgba(110, 193, 228, 0.2)'"
            onmouseout="this.style.backgroundColor='rgba(110, 193, 228, 0.1)'" (click)="onDelete()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7l16 0" />
                <path d="M10 11l0 6" />
                <path d="M14 11l0 6" />
                <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
            </svg>
        </button>
    </td>

    <!-- Botón de ver -->
    <td class="py-4 px-3 text-center">
        <button
            class="inline-flex items-center px-3 py-1.5 rounded-md text-xs font-semibold text-white hover:opacity-90 transition-opacity"
            style="background-color: #6EC1E4;" (click)="viewRecurso(recurso.id)">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
            </svg>
            Ver
        </button>
    </td>
</ng-container>
