<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" (click)="onBackdropClick()">
    <div class="bg-white rounded-lg shadow-xl border border-gray-200 w-full max-w-md" (click)="$event.stopPropagation()">
        <div class="p-6">
            <div class="flex items-start gap-4">
                <div class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ title }}</h3>
                    <p class="text-sm text-gray-600">{{ message }}</p>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 mt-6">
                <button (click)="onCancel()"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    {{ cancelText }}
                </button>
                <button (click)="onConfirm()"
                    class="px-4 py-2 text-sm font-semibold text-white rounded-lg hover:opacity-90 transition-opacity"
                    style="background-color: #ef4444;">
                    {{ confirmText }}
                </button>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isOpen" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40"></div>
