<div class="flex flex-col h-screen p-1">
  <div class="flex flex-col flex-auto flex-shrink-0 rounded-2xl bg-gray-100 h-full p-4">
    <div class="flex flex-row items-center bg-primary text-white p-4 rounded-t-xl">
      <div class="flex items-center justify-center h-10 w-10 rounded-full bg-white text-primary flex-shrink-0">
        <img *ngIf="user.image; else initials" [src]="user.image" alt="User Image" class="h-full w-full object-cover rounded-full">
        <ng-template #initials>
          <span class="text-primary">{{ user.name[0] }}</span>
        </ng-template>
      </div>
      <div class="ml-4 text-lg font-semibold">
        {{ user.name }}
      </div>
      <button (click)="closeChat()" class="ml-auto bg-transparent hover:bg-red-500 text-white hover:text-white rounded-full p-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500" title="Cerrar chat">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="flex flex-col flex-auto overflow-y-auto mb-4">
      <div class="grid grid-cols-12 gap-y-2">
        <div *ngFor="let msg of chatRoom?.messages" class="col-start-1 col-end-8 p-3 rounded-lg">
          <div class="flex flex-row items-center justify-start">
            <div class="flex items-center justify-center h-10 w-10 rounded-full bg-primary flex-shrink-0">
              <span class="text-white">{{ msg.userName[0] }}</span>
            </div>
            <div class="relative ml-3 text-sm bg-white py-2 px-4 shadow rounded-xl">
              <div>{{ msg.message }}</div>
              <div class="absolute text-xs bottom-0 right-0 -mb-5 mr-2 text-gray-500">
                Visto
              </div>
            </div>
          </div>
        </div>
      </div>
    </div> 
    <div class="flex flex-row items-center h-16 rounded-xl bg-white w-auto px-4 mt-auto">
      <div class="flex-grow ml-8">
        <input 
          [(ngModel)]="message" 
          type="text" 
          class="flex w-full border rounded-xl focus:outline-none focus:border-indigo-300 pl-4 h-10" 
          placeholder="Escribe tu mensaje..."
          (keydown.enter)="sendMessage(); $event.preventDefault();" />
      </div>
      <div class="ml-4">
        <button
          class="flex items-center justify-center bg-primary hover:bg-primary rounded-xl text-white px-4 py-2 flex-shrink-0"
          (click)="sendMessage()">
          <span class="ml-2">
            <svg class="w-4 h-4 transform rotate-45 -mt-px" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
          </span>
        </button>
      </div>
    </div>    
  </div>
</div>
