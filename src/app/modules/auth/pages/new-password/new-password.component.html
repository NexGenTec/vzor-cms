<form [formGroup]="form" class="my-10 space-y-6" (ngSubmit)="onSubmit()">
  <div class="text-center">
    <h2 class="mb-1 text-3xl font-semibold text-foreground">Configurar Nueva Contraseña</h2>
    <p class="text-sm text-muted-foreground">
      ¿Ya has restablecido la contraseña? 
      <a class="text-primary" routerLink="/auth/sign-in">Inicia sesión</a>
    </p>
  </div>

  <div class="space-y-3 text-left">
    <!-- Input Contraseña -->
    <div class="relative">
      <input [type]="passwordTextType ? 'text' : 'password'" id="password" class="peer block" placeholder=" " formControlName="password" (input)="onPasswordInput()" />
      <label for="password" class="absolute top-2 left-1 origin-[0] -translate-y-4 scale-95 transform bg-background px-2 text-sm text-muted-foreground duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:text-primary">
        Contraseña
      </label>
      <span class="absolute top-2.5 right-5 cursor-pointer text-muted-foreground" (click)="togglePasswordTextType()">
        <svg-icon *ngIf="!passwordTextType" src="assets/icons/heroicons/outline/eye-off.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
        <svg-icon *ngIf="passwordTextType" src="assets/icons/heroicons/outline/eye.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
      </span>
      <div *ngIf="form.get('password')?.invalid && (form.get('password')?.touched || submitted)" class="text-red-500 text-sm">
        La contraseña debe tener al menos 8 caracteres.
      </div>
    </div>

    <!-- Barra de seguridad -->
    <div class="grid grid-cols-4 gap-2">
      <div *ngFor="let strength of [0,1,2,3]; let i = index" 
           [class.bg-muted]="i >= passwordStrength" 
           [class.bg-primary]="i < passwordStrength" 
           class="h-1 rounded-sm"></div>
    </div>
    <span class="text-xs text-muted-foreground">
      Usa 8 o más caracteres con una combinación de letras, números y símbolos.
    </span>

    <!-- Input Confirmar Contraseña -->
    <div class="relative">
      <input [type]="confirmPasswordTextType ? 'text' : 'password'" id="confirm-password" class="peer block" placeholder=" " formControlName="confirmPassword" />
      <label for="confirm-password" class="absolute top-2 left-1 origin-[0] -translate-y-4 scale-95 transform bg-background px-2 text-sm text-muted-foreground duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:text-primary">
        Confirmar Contraseña
      </label>
      <span class="absolute top-2.5 right-5 cursor-pointer text-muted-foreground" (click)="toggleConfirmPasswordTextType()">
        <svg-icon *ngIf="!confirmPasswordTextType" src="assets/icons/heroicons/outline/eye-off.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
        <svg-icon *ngIf="confirmPasswordTextType" src="assets/icons/heroicons/outline/eye.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
      </span>
      <div *ngIf="!isPasswordMatch() && (form.get('confirmPassword')?.touched || submitted)" class="text-red-500 text-sm">
        Las contraseñas no coinciden.
      </div>
    </div>
  </div>

  <!-- Botón de envío -->
  <div>
    <app-button [disabled]="!form.valid || !isPasswordMatch()" full impact="bold" tone="primary" shape="rounded" size="medium">
      Enviar
    </app-button>
  </div>
</form>
