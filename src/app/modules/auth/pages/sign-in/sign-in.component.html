<!-- Loading overlay para éxito -->
<div
  *ngIf="isSuccessLoading"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
>
  <div class="bg-white rounded-lg p-8 text-center shadow-xl">
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-500 mx-auto mb-4"
    ></div>
    <h3 class="text-lg font-semibold text-gray-900 mb-2">
      ¡Inicio de sesión exitoso!
    </h3>
    <p class="text-sm text-gray-600">Redirigiendo al dashboard...</p>
  </div>
</div>

<!-- Formulario de inicio de sesión -->
<div class="text-center">
  <h2 class="mb-1 text-3xl font-semibold text-foreground">
    Bienvenido a vzor-cms <span class="text-primary">!</span>
  </h2>
  <p class="text-sm text-muted-foreground">
    Ingresa tus credenciales para acceder a tu cuenta.
  </p>
</div>

<form class="my-10 space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="space-y-3 text-left">
    <div class="form__group">
      <div class="relative">
        <input
          id="email"
          [ngClass]="{ 'is__invalid-input': submitted && f['email'].errors }"
          class="peer block"
          placeholder=" "
          type="email"
          formControlName="email"
          required
        />
        <label
          for="email"
          class="absolute top-2 left-1 z-10 origin-[0] -translate-y-4 scale-95 transform bg-background px-2 text-sm text-muted-foreground duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 peer-focus:text-primary"
        >
          Dirección de correo electrónico
        </label>
      </div>
      <div *ngIf="submitted && f['email'].errors" class="is__invalid-error">
        <div *ngIf="f['email'].errors['required']">Campo obligatorio</div>
        <div *ngIf="f['email'].errors['email']">
          El correo electrónico debe ser válido
        </div>
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <input
          [type]="passwordTextType ? 'text' : 'password'"
          id="password"
          [ngClass]="{ 'is__invalid-input': submitted && f['email'].errors }"
          class="peer block"
          placeholder=" "
          formControlName="password"
          required
        />
        <label
          for="password"
          class="absolute top-2 left-1 z-10 origin-[0] -translate-y-4 scale-95 transform bg-background px-2 text-sm text-muted-foreground duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 peer-focus:text-primary"
        >
          Contraseña
        </label>
        <span
          class="absolute top-2.5 right-5 cursor-pointer text-muted-foreground"
          (click)="togglePasswordTextType()"
        >
          <svg-icon
            [src]="
              !passwordTextType
                ? 'assets/icons/heroicons/outline/eye-off.svg'
                : 'assets/icons/heroicons/outline/eye.svg'
            "
            [svgClass]="'h-5 w-5'"
          >
          </svg-icon>
        </span>
      </div>
      <div *ngIf="submitted && f['password'].errors" class="is__invalid-error">
        <div *ngIf="f['password'].errors['required']">Campo obligatorio</div>
      </div>
    </div>
  </div>

  <div class="mb-2 flex items-center justify-between space-x-3">
    <div class="flex items-center">
      <input id="remember-me" name="remember-me" type="checkbox" />
      <label for="remember-me" class="ml-2 block text-sm text-muted-foreground">
        Recuérdame
      </label>
    </div>

    <!-- <app-button
      routerLink="/auth/forgot-password"
      impact="none"
      tone="primary"
      shape="rounded"
      size="small"
    >
      ¿Olvidaste tu contraseña?
    </app-button> -->
  </div>

  <!-- Botón de envío -->
  <div>
    <app-button
      full
      impact="bold"
      tone="primary"
      shape="rounded"
      size="medium"
      [disabled]="isLoading"
    >
      <div class="flex items-center justify-center">
        <div
          *ngIf="isLoading"
          class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"
        ></div>
        {{ isLoading ? "Iniciando sesión..." : "Iniciar sesión" }}
      </div>
    </app-button>
  </div>
</form>
