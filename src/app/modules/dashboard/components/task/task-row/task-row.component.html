<ng-container>
  <!-- Checkbox para selección de tareas -->
  <td class="text-center">
    <input
      [(ngModel)]="task.selected"
      class="checkbox checkbox-sm"
      data-datatable-row-check="true"
      type="checkbox"
      [value]="task.id" />
  </td>
  
  <!-- Información de la tarea (Título y Descripción) -->
  <td>
    <div class="flex items-center gap-2.5">
      <div class="flex flex-col">
        <a class="text-sm font-semibold text-foreground hover:text-primary" href="#">
          {{ task.title }}
        </a>
      </div>
    </div>
  </td>

  <!-- <span class="text-xs font-medium text-muted-foreground/70">
    {{ task.description || 'Sin descripción' }}
  </span> -->
  
  <!-- Persona asignada -->
  <td>
    <span class="text-xs font-medium text-muted-foreground/70">
      {{ task.assignedTo ? task.assignedTo : 'No asignado' }}
    </span>
    
  </td>

  <!-- Prioridad de la tarea -->
  <td>
    <span class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
      [ngClass]="{
        'bg-red-500/10 text-red-800': task.priority === 'Baja',
        'bg-yellow-500/10 text-yellow-800': task.priority === 'Media',
        'bg-green-500/10 text-green-800': task.priority === 'Alta'
      }">
      {{ task.priority || 'Baja' }}
    </span>
  </td>
  
  <!-- Fecha límite -->
  <td>
    <span class="text-xs font-medium text-muted-foreground/70">
      {{ task.dueDate ? (task.dueDate | date: 'dd/MM/yyyy') : 'Sin fecha' }}
    </span>
  </td>
  
  <!-- Estado de la tarea -->
  <td>
    <span class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
      [ngClass]="task.completed ? 'bg-green-500/10 text-green-800' : 'bg-blue-500/10 text-blue-800'">
      {{ task.completed ? 'Completada' : 'Pendiente' }}
    </span>
  </td>

  <td>
    <button class="flex h-7 w-7 items-center justify-center rounded-md text-blue-500 hover:bg-card hover:text-foreground"  (click)="editTask(task)">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-edit">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" />
        <path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" />
        <path d="M16 5l3 3" />
      </svg>
    </button>
  </td>

  <!-- Delete Button -->
  <td>
    <button class="flex h-7 w-7 items-center justify-center rounded-md text-red-500 hover:bg-card hover:text-foreground" (click)="openDeleteModal(task.id)">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-trash">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <path d="M4 7l16 0" />
        <path d="M10 11l0 6" />
        <path d="M14 11l0 6" />
        <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
        <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
      </svg>
    </button>
  </td>

  <!-- Modal de confirmación -->
  <div *ngIf="isDeleteModalOpen" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md mx-4 sm:w-2/3 lg:w-1/3">
      <h3 class="text-lg font-semibold mb-4 text-center">
        ¿Estás seguro de que deseas eliminar esta tarea?
      </h3>
      <div class="flex justify-center gap-4">
        <button class="px-4 py-2 bg-gray-300 rounded-md" (click)="closeDeleteModal()">Cancelar</button>
        <button class="px-4 py-2 bg-red-500 text-white rounded-md" (click)="confirmDelete()">Eliminar</button>
      </div>
    </div>
  </div>


  
  <!-- Botón de acciones -->
  <td class="text-center">
    <button
      class="flex h-7 w-7 items-center justify-center rounded-md text-muted-foreground hover:bg-card hover:text-foreground">
      <span class="flex-none rounded-md bg-primary px-4 py-1 text-xs font-semibold text-primary-foreground hover:bg-primary-dark transition" (click)="viewTask(task.id)">Ver</span>
    </button>
  </td>
</ng-container>
