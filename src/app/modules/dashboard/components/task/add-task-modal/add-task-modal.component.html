<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
    <button 
      (click)="closeModal()" 
      class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 focus:outline-none"
      aria-label="Cerrar Modal"
    >
      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  
    <!-- Formulario de Tarea -->
    <form [formGroup]="taskForm" (ngSubmit)="addTask()">
      <div class="space-y-4">
        <!-- Título de la Tarea -->
        <div>
          <label for="title" class="block text-sm font-semibold">Título de la Tarea</label>
          <input 
            id="title"
            formControlName="title"
            type="text"
            class="w-full px-3 py-2 border border-gray-300 rounded-md"
            placeholder="Ingrese el título"
            aria-labelledby="title"
          />
          <div *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched" class="text-red-500 text-sm">
            El título es obligatorio.
          </div>          
        </div>

        <!-- Descripción de la Tarea -->
        <div>
          <label for="description" class="block text-sm font-semibold">Descripción</label>
          <textarea 
            id="description"
            formControlName="description"
            class="w-full px-3 py-2 border border-gray-300 rounded-md"
            placeholder="Ingrese una descripción"
            rows="3"
          ></textarea>
          <div *ngIf="taskForm.get('description')?.invalid && taskForm.get('description')?.touched" class="text-red-500 text-sm">
            La descripción es obligatoria.
          </div>
        </div>

        <!-- Prioridad de la Tarea -->
        <div>
          <label for="priority" class="block text-sm font-semibold">Prioridad</label>
          <select 
            id="priority"
            formControlName="priority"
            class="w-full px-3 py-2 border border-gray-300 rounded-md"
          >
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
          </select>
          <div *ngIf="taskForm.get('priority')?.invalid && taskForm.get('priority')?.touched" class="text-red-500 text-sm">
            La prioridad es obligatoria.
          </div>
        </div>

        <!-- Fecha Límite -->
        <div>
          <label for="dueDate" class="block text-sm font-semibold">Fecha Límite</label>
          <input 
            id="dueDate"
            formControlName="dueDate"
            type="date"
            class="w-full px-3 py-2 border border-gray-300 rounded-md"
          />
          <div *ngIf="taskForm.get('dueDate')?.invalid && taskForm.get('dueDate')?.touched" class="text-red-500 text-sm">
            La fecha límite es obligatoria.
          </div>
        </div>

        <div>
          <label for="asignadoA" class="block text-sm font-semibold">Asignado a</label>
          <select *ngIf="filteredUsers.length > 1"
                  id="asignadoA"
                  formControlName="assignedTo"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <option value="">Seleccione un usuario</option>
            <option *ngFor="let user of filteredUsers" [value]="user.name">
              {{ user.name }}
            </option>
          </select>
    
          <div *ngIf="taskForm.get('assignedTo')?.invalid && taskForm.get('assignedTo')?.touched" class="text-red-500 text-sm">
            El nombre del responsable es obligatorio.
          </div>
        </div>

        <!-- Botón de Agregar -->
        <div class="flex justify-end">
          <button 
            type="submit" 
            class="flex-none rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground hover:bg-primary-dark transition"
            [disabled]="taskForm.invalid">
            Agregar
          </button>        
        </div>
      </div>
    </form>
  </div>
</div>
