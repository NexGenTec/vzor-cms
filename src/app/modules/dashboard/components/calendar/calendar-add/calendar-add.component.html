<div class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-4 relative overflow-y-auto max-h-[80vh]">
    <button 
      (click)="close()" 
      class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 focus:outline-none"
      aria-label="Cerrar Modal">
      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="modal-content bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
      <form (ngSubmit)="onSubmit()">
        <!-- Título -->
        <label for="titulo" class="block text-sm font-medium text-gray-700">Título</label>
        <input id="titulo" [(ngModel)]="event.titulo" name="titulo" required class="mt-1 p-2 border border-gray-300 rounded w-full" />
  
        <!-- Descripción -->
        <label for="descripcion" class="block text-sm font-medium text-gray-700 mt-4">Descripción</label>
        <textarea id="descripcion" [(ngModel)]="event.descripcion" name="descripcion" class="mt-1 p-2 border border-gray-300 rounded w-full"></textarea>
  
        <!-- Fecha -->
        <label for="fecha" class="block text-sm font-medium text-gray-700 mt-4">Fecha</label>
        <input id="fecha" type="date" [(ngModel)]="event.fecha" name="fecha" required class="mt-1 p-2 border border-gray-300 rounded w-full" />
  
        <!-- Hora -->
        <label for="hora" class="block text-sm font-medium text-gray-700 mt-4">Hora</label>
        <input id="hora" type="time" [(ngModel)]="event.hora" name="hora" required class="mt-1 p-2 border border-gray-300 rounded w-full" />
  
        <!-- Ubicación -->
        <label for="ubicacion" class="block text-sm font-medium text-gray-700 mt-4">Ubicación</label>
        <input id="ubicacion" [(ngModel)]="event.ubicacion" name="ubicacion" class="mt-1 p-2 border border-gray-300 rounded w-full" />
  
        <!-- Tipo -->
        <label for="tipo" class="block text-sm font-medium text-gray-700 mt-4">Tipo</label>
        <select id="tipo" [(ngModel)]="event.tipo" name="tipo" class="mt-1 p-2 border border-gray-300 rounded w-full">
          <option value="Reunión">Reunión</option>
          <option value="Recordatorio">Recordatorio</option>
          <option value="Evento">Evento</option>
          <option value="Otro">Otro</option>
        </select>
  
        <!-- Invitados -->
        <label for="invitados" class="block text-sm font-medium text-gray-700 mt-4">Invitados (correos separados por coma)</label>
        <input id="invitados" [(ngModel)]="event.invitados" name="invitados" class="mt-1 p-2 border border-gray-300 rounded w-full" />
  
        <!-- Recurrente -->
        <label for="esRecurrente" class="block text-sm font-medium text-gray-700 mt-4">Es recurrente</label>
        <input type="checkbox" id="esRecurrente" [(ngModel)]="event.esRecurrente" name="esRecurrente" class="mt-1" />     
  
        <!-- Frecuencia -->
        <!-- <label for="frecuenciaRecurrencia" class="block text-sm font-medium text-gray-700 mt-4">Frecuencia</label>
        <select id="frecuenciaRecurrencia" [(ngModel)]="event.frecuenciaRecurrencia" name="frecuenciaRecurrencia" 
                *ngIf="event.esRecurrente" class="mt-1 p-2 border border-gray-300 rounded w-full">
          <option value="Diaria">Diaria</option>
          <option value="Semanal">Semanal</option>
          <option value="Mensual">Mensual</option>
          <option value="Anual">Anual</option>
        </select> -->

        <!-- Color de etiqueta -->
        <label for="colorEtiqueta" class="block text-sm font-medium text-gray-700 mt-4">Color de la etiqueta</label>
        <div class="relative">
          <!-- Botón principal que muestra el color seleccionado -->
          <button type="button" class="w-full p-2 border border-gray-300 rounded flex items-center justify-between" (click)="toggleDropdown()">
            <div class="flex items-center space-x-2">
              <div class="w-6 h-6 rounded-full border border-gray-400" [ngStyle]="{'background-color': event.colorEtiqueta}"></div>
              <span>{{ event.colorEtiqueta || 'Selecciona un color' }}</span>
            </div>
          </button>
          
          <!-- Dropdown con los colores -->
          <div *ngIf="dropdownOpen" class="absolute left-0 right-0 mt-2 bg-white border border-gray-300 rounded-md shadow-lg z-10 p-2 flex flex-wrap">
            <button *ngFor="let color of colorOptions"
                    type="button" 
                    [ngStyle]="{'background-color': color}" 
                    class="w-10 h-10 rounded-full border-2 transition-all duration-200"
                    [class.border-black]="event.colorEtiqueta === color"
                    [class.scale-110]="event.colorEtiqueta === color"
                    (click)="selectColor(color)">
            </button>
          </div>
        </div>        

        <!-- Botones -->
        <div class="mt-6 flex justify-end space-x-4">
          <button type="submit" class="hover:bg-primary-600 flex-none rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
