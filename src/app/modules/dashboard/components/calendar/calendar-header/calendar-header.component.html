<header class="flex flex-col items-center justify-between border-b border-gray-200 px-4 py-3 lg:flex-row lg:px-6 lg:py-4">
    <h1 class="text-base font-semibold leading-6 text-gray-900">
        <time [attr.datetime]="currentDate | date:'yyyy-MM'">{{ currentDate | date:'MMMM yyyy':'es' }}</time>
    </h1>        

    <!-- Controles de Navegación -->
    <div class="flex w-full justify-between mt-4 lg:w-auto lg:mt-0 lg:flex-row">
        <div class="relative flex items-center rounded-md bg-white shadow-sm">
            <button (click)="navigateMonth(-1)" type="button"
                class="hover:bg-primary-600 flex-none rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground">
                <span class="sr-only">Mes anterior</span>
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
                        clip-rule="evenodd" />
                </svg>
            </button>

            <button (click)="goToToday()" type="button"
                class="border border-gray-300 px-3 py-1.5 text-xs font-semibold text-gray-900 rounded-md shadow-sm 
                transition duration-200 md:block md:text-sm md:px-4 md:py-2 md:mt-0 mt-2">
                Hoy
            </button>

            <button (click)="navigateMonth(1)" type="button"
                class="hover:bg-primary-600 flex-none rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground">
                <span class="sr-only">Próximo mes</span>
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
                        clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- Botones de Vista y Evento -->
        <div class="flex mt-4 space-x-4 lg:mt-0">
            <button type="button" (click)="selectView('month')"
                class="flex items-center gap-x-1.5 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-300 hover:bg-gray-50">
                Vista mensual
            </button>

            <button (click)="addEvent()" type="button"
                class="hover:bg-primary-600 flex-none rounded-md bg-primary px-4 py-2.5 text-xs font-semibold text-primary-foreground">
                Agregar Cita
            </button>
        </div>
        <app-calendar-add *ngIf="isModalOpen" (closeModal)="closeModal()"></app-calendar-add>
    </div>
</header>
