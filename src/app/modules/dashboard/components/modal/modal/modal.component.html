<div *ngIf="isOpen" class="fixed inset-0 bg-gray-500 bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md mx-4 sm:w-2/3 lg:w-1/3 xl:w-1/4">
      <h2 class="text-lg font-semibold mb-4 text-center">Confirmar Exportación</h2>
      <p class="mb-4 text-center">¿Está seguro de que desea exportar ?</p>
      <div class="flex justify-center space-x-4">
        <button (click)="confirmExport()" class="px-4 py-2 bg-red-500 text-white rounded-md">Sí</button>
        <button (click)="cancelExport()" class="bg-gray-300 text-black px-6 py-2 rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500">Cancelar</button>
      </div>
    </div>
  </div>
