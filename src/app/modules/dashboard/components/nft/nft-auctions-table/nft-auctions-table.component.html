<div class="flex-col rounded-lg bg-background px-8 py-8 sm:flex-row">
  <div class="mb-4 flex items-center justify-between">
    <div class="flex-col items-center">
      <h3 class="text-md font-bold text-foreground">Lista de Tareas</h3>
      <span class="text-xs text-muted-foreground">Actualizado hace un momento</span>
    </div>
    <button
      class="flex-none rounded-md bg-card px-4 py-2.5 text-xs font-semibold text-muted-foreground hover:bg-muted hover:text-foreground"
      [routerLink]="['/layout/dashboard/task']">
      Agregar Tarea
    </button>
  </div>  

  <!-- Contenido de la tabla -->
  <div class="relative overflow-x-auto">
    <!-- Esqueleto de carga -->
    <div *ngIf="isLoading" class="space-y-4">
      <div class="h-8 w-3/4 rounded bg-gray-200 animate-pulse"></div>
      <div class="h-6 w-full rounded bg-gray-200 animate-pulse"></div>
      <div class="h-6 w-full rounded bg-gray-200 animate-pulse"></div>
      <div class="h-6 w-3/4 rounded bg-gray-200 animate-pulse"></div>
    </div>

    <!-- Mensaje de no hay tareas -->
    <div *ngIf="!isLoading && tasks.length === 0" class="text-center text-muted-foreground py-8">
      <p class="text-md font-semibold">No hay tareas agregadas</p>
    </div>

    <!-- Tabla de tareas -->
    <table *ngIf="!isLoading && tasks.length > 0" class="w-full table-auto">
      <thead class="text-xs uppercase text-muted-foreground">
        <tr>
          <th class="py-3 text-left">Título</th>
          <th class="py-3 text-left">Prioridad</th>
          <th class="py-3 text-left">Fecha Límite</th>
          <th class="py-3 text-left">Completada</th>
          <th class="py-3 text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let task of tasks" class="border-b border-dashed border-border hover:bg-card">
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <a class="text-sm font-semibold text-foreground hover:text-primary" href="#">
              {{ task.title }}
            </a>
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <span class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
              [ngClass]="{
                'bg-red-500/10 text-red-800': task.priority === 'Baja',
                'bg-yellow-500/10 text-yellow-800': task.priority === 'Media',
                'bg-green-500/10 text-green-800': task.priority === 'Alta'
              }">
              {{ task.priority || 'Baja' }}
            </span>
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <span class="text-xs font-medium text-muted-foreground/70">
              {{ task.dueDate ? (task.dueDate | date: 'dd/MM/yyyy') : 'Sin fecha' }}
            </span>
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-left border-b border-muted/20">
            <span class="rounded-[30px] px-2 py-0.5 text-xs font-medium"
            [ngClass]="task.completed ? 'bg-green-500/10 text-green-800' : 'bg-blue-500/10 text-blue-800'">
            {{ task.completed ? 'Completada' : 'Pendiente' }}
          </span>            
          </td>
          <td class="py-3 px-4 text-sm font-semibold text-right border-b border-muted/20">
            <div class="flex justify-end">
              <button
                class="hover:bg-primary-600 flex-none rounded-md bg-primary px-2 py-2 text-xs font-semibold text-primary-foreground" (click)="viewTask(task.id)">
                <svg-icon src="assets/icons/heroicons/outline/arrow-sm-right.svg" [svgClass]="'h-5 w-5'"> </svg-icon>
              </button>
            </div>
          </td>
        </tr>        
      </tbody>
    </table>
  </div>
</div>
